name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A main push skips lint only when this exact tree already passed it on a
  # same-repository pull request (.github/scripts/ci-reuse.cjs).
  reuse:
    name: Reuse pull request result
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.reuse.outputs.tested }}
    steps:
      - uses: actions/checkout@v5

      - name: Reuse the pull request result for an identical tree
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-reuse.cjs check

  lint:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v5

      - name: CI reuse policy
        run: node --test .github/scripts/ci-reuse.test.cjs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom

      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP clean"

      - name: Release contract
        run: php tests/release-contract.php

      - name: WordPress behavior contract
        run: |
          php tests/wp-behavior-contract.php
          php tests/ingest-html-runtime.php

      - name: Native WordPress ingestion HTML contract
        run: |
          set -e
          curl --fail --silent --show-error --location --max-time 60 https://wordpress.org/wordpress-7.1.3.zip -o "$RUNNER_TEMP/wordpress-7.1.3.zip"
          echo "eb58a90ed55147f90f7bd55d0d3334960a69b7e8a4cc142c8ddfea8965218227  $RUNNER_TEMP/wordpress-7.1.3.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/wordpress-7.1.3.zip" -d "$RUNNER_TEMP/lunara-native-wordpress"
          LUNARA_WP_TEST_ROOT="$RUNNER_TEMP/lunara-native-wordpress/wordpress" php tests/ingest-html-runtime.php

      - name: Control Plane source rows runtime
        run: php tests/control-plane-sources-runtime.php

      - name: Site Studio workflow handoff runtime
        run: php tests/site-studio-workflow-runtime.php

      - name: Journal voice compiler runtime
        run: php tests/prompt-compiler-voice-runtime.php

      - name: Voice upgrade runtime
        run: php tests/voice-upgrade-runtime.php

      - name: Validator house-tells runtime
        run: php tests/validator-house-tells-runtime.php

      - name: Journal Automation contract
        run: php tests/automation-contract.php

      - name: Source Radar bridge runtime
        run: php tests/automation-source-bridge-runtime.php

      - name: Needs Attention runtime
        run: php tests/automation-attention-runtime.php

      - name: Hub telemetry runtime
        run: php tests/hub-telemetry-runtime.php

      - name: Journal Desk API and revision runtime
        run: |
          php tests/desk-api-runtime.php
          php tests/desk-rewriter-runtime.php
          php tests/story-wire-runtime.php
          php tests/publishing-runtime.php

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install editor test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Journal Desk JavaScript
        run: |
          node --check assets/desk/desk.js
          node --check assets/desk/desk-state.js
          node --test tests/*.test.cjs

      - name: OpenAPI JSON syntax
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              if 'vendor' in path.parts or 'node_modules' in path.parts:
                  continue
              with path.open(encoding='utf-8-sig') as handle:
                  json.load(handle)
          print(f"JSON clean ({len(files)} files scanned)")
          PYEOF

      # Lets the merge to main reuse this result (.github/scripts/ci-reuse.cjs).
      - name: Name the fully tested tree
        if: github.event_name == 'pull_request' && matrix.php == '8.3'
        run: |
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Record the fully tested tree
        if: github.event_name == 'pull_request' && matrix.php == '8.3'
        uses: actions/upload-artifact@v6
        with:
          name: ci-passed-tree-${{ env.TESTED_TREE }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 14
          overwrite: true
          if-no-files-found: error
