name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom

      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP clean"

      - name: Release contract
        run: php tests/release-contract.php

      - name: WordPress behavior contract
        run: |
          php tests/wp-behavior-contract.php
          php tests/ingest-html-runtime.php

      - name: Control Plane source rows runtime
        run: php tests/control-plane-sources-runtime.php

      - name: Site Studio workflow handoff runtime
        run: php tests/site-studio-workflow-runtime.php

      - name: Journal voice compiler runtime
        run: php tests/prompt-compiler-voice-runtime.php

      - name: Voice upgrade runtime
        run: php tests/voice-upgrade-runtime.php

      - name: Validator house-tells runtime
        run: php tests/validator-house-tells-runtime.php

      - name: Journal Automation contract
        run: php tests/automation-contract.php

      - name: Source Radar bridge runtime
        run: php tests/automation-source-bridge-runtime.php

      - name: Needs Attention runtime
        run: php tests/automation-attention-runtime.php

      - name: Hub telemetry runtime
        run: php tests/hub-telemetry-runtime.php

      - name: Journal Desk API and revision runtime
        run: |
          php tests/desk-api-runtime.php
          php tests/desk-rewriter-runtime.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install editor test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Journal Desk JavaScript
        run: |
          node --check assets/desk/desk.js
          node --check assets/desk/desk-state.js
          node --test tests/desk-state.test.cjs tests/desk-image-ui.test.cjs tests/desk-pitches-ui.test.cjs

      - name: OpenAPI JSON syntax
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              if 'vendor' in path.parts or 'node_modules' in path.parts:
                  continue
              with path.open(encoding='utf-8-sig') as handle:
                  json.load(handle)
          print(f"JSON clean ({len(files)} files scanned)")
          PYEOF
